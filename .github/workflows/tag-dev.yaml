name: Tag development component release

on:
  workflow_run:
    workflows: [Validate & Security]
    branches: [main]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: component-release-dev-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  tag-dev:
    name: Tag validated main commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Create immutable development tag
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch --force --tags origin
          candidate="dev-v$(date -u +%Y.%m).${SHA:0:12}"
          if git ls-remote --exit-code --tags origin "refs/tags/$candidate" >/dev/null; then
            echo "Immutable development tag already exists: $candidate"
            exit 1
          fi
          git tag -a "$candidate" -m "Validated development component release $candidate" "$SHA"
          git push origin "refs/tags/$candidate"
          git tag -f dev-latest "$SHA"
          git push --force origin refs/tags/dev-latest
      - name: Verify published development tags
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          candidate="dev-v$(date -u +%Y.%m).${SHA:0:12}"
          test "$(git rev-parse "$candidate^{commit}")" = "$SHA"
          test "$(git rev-parse 'dev-latest^{commit}')" = "$SHA"
