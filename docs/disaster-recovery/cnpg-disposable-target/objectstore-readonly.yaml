apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-dr-REPLACE_RUN_ID-objectstore-readonly
  namespace: cnpg-dr-REPLACE_RUN_ID
  annotations:
    vixens.io/objectstore-access: read-only
spec:
  configuration:
    destinationPath: s3://REPLACE_READONLY_BUCKET/cnpg/
    endpointURL: https://REPLACE_OBJECTSTORE_ENDPOINT
  # The named Secret is intentionally not created here. Gate 0 must confirm
  # externally provisioned credentials are read-only before any apply.
  s3Credentials:
    accessKeyId:
      name: cnpg-dr-REPLACE_RUN_ID-readonly
      key: ACCESS_KEY_ID
    secretAccessKey:
      name: cnpg-dr-REPLACE_RUN_ID-readonly
      key: SECRET_ACCESS_KEY
