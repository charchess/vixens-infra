---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - apps/descheduler.yaml
  - apps/external-dns-unifi.yaml
  - apps/external-dns-unifi-secrets.yaml
  - apps/keda.yaml
  - apps/keda-http-addon.yaml
  - apps/kyverno.yaml
  - apps/policy-reporter.yaml
  - apps/reloader.yaml
  - apps/renovate.yaml
  - apps/snmp-exporter.yaml
  - apps/trivy.yaml
  - apps/victoria-metrics.yaml
  - apps/vpa.yaml
  - apps/whoami.yaml
labels:
  - pairs:
      vixens.io/domain: infra
    includeSelectors: false
    includeTemplates: false
