---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-unifi-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-infra.git
    targetRevision: 319cf8182f6bf07ddd18c8ce02e7da7c4911a40a
    path: apps/40-network/external-dns-unifi/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: networking
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
