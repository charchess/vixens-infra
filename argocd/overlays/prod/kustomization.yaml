---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - apps/media-shared-secrets.yaml
  - apps/postgresql-shared.yaml
  - apps/loki.yaml
  - apps/authentik.yaml
  - apps/redis-shared.yaml
  - apps/prometheus-operator-crds.yaml
  - apps/descheduler.yaml
  - apps/maturity-controller.yaml
  - apps/trivy.yaml
  - apps/external-dns-unifi-secrets.yaml
  - apps/external-dns-gandi-secrets.yaml
  - apps/policy-reporter.yaml
  - apps/goldilocks.yaml
  - apps/fluent-bit.yaml
  - apps/reloader.yaml
  - apps/hubble-ui.yaml
  - apps/traefik-dashboard.yaml
  - apps/whoami.yaml
  - apps/snmp-exporter.yaml
  - apps/grafana-ingress.yaml
labels:
  - pairs:
      vixens.io/domain: infra
    includeSelectors: false
    includeTemplates: false
