---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - apps/adguard-home.yaml
  - apps/shared-namespaces.yaml
  - apps/mail-gateway.yaml
  - apps/traefik-dashboard.yaml
  - apps/priority-classes.yaml
  - apps/whoami.yaml
  - apps/snmp-exporter.yaml
  - apps/grafana-ingress.yaml
labels:
  - pairs:
      vixens.io/domain: infra
    includeSelectors: false
    includeTemplates: false
