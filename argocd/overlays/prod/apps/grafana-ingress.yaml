---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-ingress
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "8" # Après grafana (wave 6)
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-infra.git
    targetRevision: 1703ad0a9f4eac3d13a39305a8829d3c4b2c4651
    path: apps/02-monitoring/grafana-ingress/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
