---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-shared-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-infra.git
    targetRevision: 88c47931b5421a0ca99c7ba73f7f89979572372d
    path: apps/20-media/media-shared-secrets/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
