---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pyload
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  destination:
    namespace: downloads
    server: https://kubernetes.default.svc
  project: default
  source:
    path: apps/20-media/pyload/overlays/prod
    repoURL: https://github.com/charchess/vixens-infra.git
    targetRevision: a10b6e0c9a154e4de470b12bb99413b2c5951644
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
