---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-lb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2" # Deploy before cilium-config (wave -1)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-infra.git
    targetRevision: a10b6e0c9a154e4de470b12bb99413b2c5951644
    path: apps/00-infra/cilium-lb/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    # Cilium CRDs are cluster-scoped, but convention is kube-system
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
