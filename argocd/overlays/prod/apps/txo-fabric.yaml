---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: txo-fabric
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/compare-options: ServerSideDiff=false
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-infra.git
    # #53: use the reviewed retirement revision; this preserves application
    # identity while letting the existing automated prune finish tenant cleanup.
    targetRevision: 9c176eeb2d849bd5c3179a157b2cdf9aa5736780
    path: apps/60-services/txo-fabric/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: txo-fabric-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
