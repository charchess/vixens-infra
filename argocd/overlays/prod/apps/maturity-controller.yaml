---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maturity-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15" # Standard application tier
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-infra.git
    targetRevision: bc95c075ca9c032a6d71a169082db9a578903628
    path: apps/00-infra/maturity-controller/base
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
