---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-namespaces
  namespace: argocd
  labels:
    vixens.lab/environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-infra.git
    targetRevision: 64418e0a4420952ca4823cc9d2eba172b5fd9f28
    path: apps/00-platform/shared-namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
