---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: contacts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5" # Standard application tier
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/charchess/vixens-infra.git
    targetRevision: bfa310130f8ddcbb2c87f7f8255581c60fd27b39
    path: apps/40-network/contacts/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: contacts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
