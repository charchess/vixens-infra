apiVersion: custody.truxonline.io/v1alpha1
kind: OpenBaoFabricV2CustodyInitRunnerContract
metadata:
  name: openbao-fabric-v2-custody-init-runner
spec:
  executable: false
  runtimeCapability: false
  gitOpsConsumer: false
  fixedTransportIdentity:
    endpoint: https://openbao-fabric-v2.txo-fabric-system.svc:8200
    serverName: openbao-fabric-v2.txo-fabric-system.svc
    trustAnchorType: ca-root-der
    trustAnchorSHA256: 85e106a9143f39d1f62180b50878a3ae012992ea0998660581f3b874a3bd7421
  ceremonyWindow:
    maxSeconds: 1800
    expiryState: STOPPED_UNKNOWN
    failedBeforeInitState: STOPPED_UNKNOWN
    failedAfterInitState: STOPPED_UNKNOWN
    retryAllowed: false
    secondInitAllowed: false
    shareReuseAllowed: false
  actors:
    runner: urn:truxonline:openbao-fabric-v2-custody:role:infra-custody-init-runner:v1
    operator: urn:truxonline:openbao-fabric-v2-custody:role:electra-runtime-operator:v1
    issuer: urn:truxonline:openbao-fabric-v2-custody:role:infra-custody-issuer:v1
    witness: urn:truxonline:openbao-fabric-v2-custody:role:lisa-independent-witness:v1
    pairwiseDistinct: true
  shamir:
    threshold: 3
    shares: 5
    material: ABSENT_OUT_OF_GIT_CUSTODY_REQUIRED
  casStateMachine:
    initial: requested
    transitions:
      requested: [witnessed]
      witnessed: [initialized]
      initialized: [revoked]
      revoked: []
    terminal: revoked
  requestSchema:
    allowedFields: [protocolVersion, fabricRevision, endpointIdentity, shamirThreshold, shamirShares, requestId, expectedVersion, expiresAt]
  ledgerSchema:
    allowedFields: [requestId, version, state, fabricRevision, endpointIdentity, operatorAttribution, witnessAttribution, auditOutcome, expiresAt]
  receiptSchema:
    allowedFields: [requestId, version, state, fabricRevision, endpointIdentity, custodyAttribution, auditOutcome, revoked, expiresAt]
  forbiddenPersistence: [credential, token, share, recoveryKey, rootToken, wrappedPayload, policyBody, providerPayload]
  refusalMatrix:
    refuseEndpointMismatch: true
    refuseServerNameMismatch: true
    refuseTrustAnchorMismatch: true
    refuseMethodOutsideInitializeOrRevoke: true
    refuseInvalidTransition: true
    refuseCASVersionMismatch: true
    refuseNonThreeOfFive: true
    refuseActorCollision: true
    refuseExpiredWindow: true
    refuseRetryOrSecondInitOrShareReuse: true
    refuseSecretMaterial: true
