apiVersion: custody.truxonline.io/v1
kind: DurableCustodyLedgerAdapterV1OperationalQualification
metadata:
  name: durable-custody-ledger-adapter-v1-provider-selection
spec:
  executable: false
  runtimeCapability: false
  pr132ContractPath: contracts/durable-custody-ledger-adapter-v1.yaml
  pr132Interface: [createLedger, acquireLease, compareAndAppend, readVerifiedChain, closeLease]
  conformanceAttestation:
    allowedFields: [contractDigest, vectorDigest, scope, outcome, reportDigest]
    additionalProperties: false
  isolationAttestation:
