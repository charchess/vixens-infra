  prohibitedSurfaces: [backend-selection, backend-configuration, backend-provisioning, url, identity, credential, adapter-implementation, runner, openbao, kubernetes, argo, gitops]
  qualification:
    providerSelection: prohibited
    requiredReport: provider-selection-decision-record
    gate: independent-architecture-and-risk-review
