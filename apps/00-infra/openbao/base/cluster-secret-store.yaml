---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      # DNS/SNI identity only: never replace this with an IP address or HTTP.
      server: https://nas.truxonline.com:8200
      # The private CA chain is supplied out-of-band by the approved trust
      # distribution path. It is deliberately referenced here, not embedded.
      caProvider:
        type: ConfigMap
        name: openbao-ca
        namespace: external-secrets
        key: ca.crt
      # KV v2 engine mount. Patch if the actual OpenBao mount differs.
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: openbao-transit
          serviceAccountRef:
            name: openbao-transit
            namespace: external-secrets
