---
# Shared PostgreSQL: client access is controlled by PostgreSQL credentials.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgresql-shared
  namespace: databases
spec:
  endpointSelector:
    matchLabels:
      vixens.io/database-role: shared-postgresql
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: databases
            vixens.io/database-role: shared-postgresql
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
