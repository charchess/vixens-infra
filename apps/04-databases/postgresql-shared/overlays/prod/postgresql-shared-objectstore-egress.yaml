---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgresql-shared-objectstore-egress
  namespace: databases
  labels:
    app.kubernetes.io/name: postgresql-shared
spec:
  endpointSelector:
    matchLabels:
      vixens.io/database-role: shared-postgresql
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toCIDR:
        - 192.168.111.69/32
      toPorts:
        - ports:
            - port: "30157"
              protocol: TCP
